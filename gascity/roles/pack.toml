[pack]
name = "gc-roles"
version = "0.1.0"
schema = 2

# The gc import targets ../fragments — the fragment-only sub-pack — NOT the
# gascity parent. The roles need exactly one parent asset (the public
# gc-role-worker claim-protocol fragment); importing the whole parent
# re-exported its skills/ into every consumer as a duplicate "gc.mayor"
# alias beside the canonical city-level "gascity.mayor" registration
# (fernanja gc city, 2026-08-20). Single-source contract unchanged: the
# fragment lives once, in gc-fragments, and no pack carries a copy.
[imports.gc]
source = "../fragments"
