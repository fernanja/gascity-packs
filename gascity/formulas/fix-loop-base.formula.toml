description = """
Virtual review-fix methodology contract.

This methodology contract turns failed review findings into implementation
fixes and a follow-up review. Entrypoint adapters own publication and external
state; concrete methodology packs override this loop to use their native fix
discipline.
"""
formula = "fix-loop-base"
version = 1
target_required = false
internal = true

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.context_path]
description = "Optional context bundle path."
default = ""

[vars.findings_path]
description = "Review findings report path to fix."
required = true

[vars.implementation_formula]
description = "Implementation formula used for fix work."
default = "implement"

[vars.implementation_target]
description = "Role target for implementation work."
default = "gc.implementation-worker"

[vars.code_review_formula]
description = "Review formula used after fixes."
default = "review"

[vars.max_iterations]
description = "Maximum fix/review attempts."
default = "10"

[vars.push]
description = "Publishing intent of the build under repair. With open_pr, true means each fix pass ends with a local fix commit recorded as gc.build.handoff_commit and one [skip ci] checkpoint push, then goes straight to re-review. No pull request is opened and CI does not run until the publish step (reviewer-first, gc-gef2p8)."
default = "false"

[vars.open_pr]
description = "Publishing intent of the build under repair. See push: a fix pass opens no pull request and waits for no CI."
default = "false"

# Fix scope (gc-80xjc5). `plan-fixes`, `apply-fixes` and `re-review` are members
# of the `fix-body` scope. A formula `needs` is satisfied when its predecessor
# CLOSES, whatever its outcome (engine readiness is status-only), so without a
# scope a hard-failed apply-fixes still readied re-review: loop gcas-w491q5w ran
# and passed a re-review after apply-fixes closed gc.failure_class=hard three
# times. When a member closes with an explicit gc.outcome=fail the engine skips
# the members that have not run and closes `fix-body` with gc.outcome=fail, so
# the loop root closes fail. No member carries gc.on_fail=abort_scope: apply-fixes
# and re-review are checked steps, and the engine copies step metadata onto each
# re-spawned attempt bead (see "Stopping On A Failed Step" in ../REQUIREMENTS.md).
[[steps]]
id = "fix-body"
title = "Fix loop scope"
needs = ["re-review"]
metadata = { "gc.kind" = "scope", "gc.scope_name" = "fix-loop", "gc.scope_role" = "body" }
description_file = "../assets/workflows/fix-loop-base/fix-body.md"

[[steps]]
id = "plan-fixes"
title = "Plan review fixes"
metadata = { "gc.scope_ref" = "fix-body", "gc.scope_role" = "member", "gc.run_target" = "gc.review-synthesizer" }
description_file = "../assets/workflows/fix-loop-base/plan-fixes.md"

[[steps]]
id = "apply-fixes"
title = "Apply review fixes"
needs = ["plan-fixes"]
metadata = { "gc.scope_ref" = "fix-body", "gc.scope_role" = "member", "gc.run_target" = "{{implementation_target}}" }
description_file = "../assets/workflows/fix-loop-base/apply-fixes.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/handoff-commit-ancestor.sh"
timeout = "2m"

[[steps]]
id = "re-review"
title = "Re-review fixed work"
needs = ["apply-fixes"]
metadata = { "gc.scope_ref" = "fix-body", "gc.scope_role" = "member", "gc.run_target" = "gc.implementation-reviewer", "gc.build.artifact_schema" = "gc.build.review.v1", "gc.build.artifact_path_keys" = "gc.build.review_report_path" }
description_file = "../assets/workflows/fix-loop-base/re-review.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"
