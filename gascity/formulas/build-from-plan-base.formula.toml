description = """
Virtual build continuation contract from approved requirements.

This suffix starts when approved requirements already exist. It produces the
implementation plan and plan-review verdict, then hands off to
`build-from-decompose-base` through the inherited `prepare-decompose` step.
"""
formula = "build-from-plan-base"
version = 1
extends = ["build-from-decompose-base"]
target_required = false
internal = true

[requires]
formula_compiler = ">=2.0.0"

[metadata.gc.methodology]
allowed_drain_policies = ["separate", "same-session"]
implementation_strategy = "drain"
interaction_modes = ["interactive", "autonomous", "headless"]
review_modes = ["report", "agent", "interactive"]

[vars]
[vars.review_verification_scope]
description = "Reviewer verification breadth: scoped (full non-browser suites + changed browser specs; default pre-GA) or full (adds the complete browser suite on every device profile; post-GA hardening)."
default = "scoped"

[vars.planning_formula]
description = "Planning methodology formula used for requirements and implementation-plan artifacts."
default = "planning-base"

[vars.plan_path]
description = "Implementation plan artifact path to create or reuse."
default = ""

[vars.plan_review_path]
description = "Plan-review artifact path to create or reuse."
default = ""

# Input gate (gcas-6ut42h): the approved requirements this entrypoint consumes
# are validated by the controller when this step closes, so a file missing a
# required section stops the build here, at minute one, not at prepare-review.
# One attempt: an input is not repaired by the step that reads it. The gate
# keeps gc.on_fail=abort_scope; with max_attempts = 1 there is no re-spawned
# attempt bead for the engine to copy that key onto (see "Stopping On A
# Failed Step" in ../REQUIREMENTS.md).
[[steps]]
id = "prepare-plan"
title = "Validate plan continuation inputs"
metadata = { "gc.scope_ref" = "planning-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.requirements.v1", "gc.build.artifact_path_keys" = "gc.var.requirements_path,gc.build.requirements_path" }
description_file = "../assets/workflows/build-from-plan-base/prepare-plan.md"

[steps.check]
max_attempts = 1

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan"
title = "Produce implementation plan"
needs = ["prepare-plan"]
metadata = { "gc.scope_ref" = "planning-body", "gc.scope_role" = "member", "gc.run_target" = "gc.design-author", "gc.build.artifact_schema" = "gc.build.plan.v1", "gc.build.artifact_path_keys" = "gc.build.plan_path,gc.var.plan_path", "gc.build.coverage_permits" = "required" }
description_file = "../assets/workflows/build-from-plan-base/plan.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "plan-review"
title = "Review implementation plan"
needs = ["plan"]
metadata = { "gc.scope_ref" = "planning-body", "gc.scope_role" = "member", "gc.run_target" = "gc.review-synthesizer", "gc.build.artifact_schema" = "gc.build.plan_review.v1", "gc.build.artifact_path_keys" = "gc.build.plan_review_path,gc.var.plan_review_path" }
description_file = "../assets/workflows/build-from-plan-base/plan-review.md"

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "../assets/scripts/checks/build-artifact-valid.sh"
timeout = "5m"

[[steps]]
id = "prepare-decompose"
title = "Validate decompose continuation inputs"
needs = ["plan-review"]
metadata = { "gc.scope_ref" = "planning-body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/build-from-plan-base/prepare-decompose.md"
